[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mvte"
version = "0.1.0"
description = "Manga Vision & Translation Engine (local, modular, OpenSpec-driven)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    "shapely>=2.0.0",
]

[project.optional-dependencies]
onnx = ["onnxruntime>=1.17.0"]
directml = ["onnxruntime-directml>=1.17.0"]
gui = ["PySide6>=6.7.0"]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]

[project.scripts]
mvte = "mvte.interfaces.cli.main:main"
mvte-gui = "mvte.interfaces.gui.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
